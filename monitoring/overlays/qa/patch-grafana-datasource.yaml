apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources    # base name, namePrefix will make it qa-grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://qa-prometheus.monitoring-qa.svc.cluster.local:9090
        isDefault: true
        editable: false