# overlays/qa/patch-prometheus-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring-qa
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s          # slower scrape in qa is fine

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: blog-backend
        metrics_path: /actuator/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [dwp-qa]           # ← scoped to this env's app namespace
        relabel_configs: ...

      - job_name: blackbox-dwp-platform-ui
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              # ← env-specific service DNS
              - http://dwp-platform-ui.dwp-qa.svc.cluster.local/health
              - http://dwp-platform-ui.dwp-qa.svc.cluster.local/
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring-qa.svc.cluster.local:9115