# overlays/qa/prometheus-rbac-patch.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus          # must match: base name "prometheus" + namePrefix "qa-"
subjects:
  - kind: ServiceAccount
    name: qa-prometheus        # same — namePrefix applies to SA too
    namespace: monitoring-qa   # ← the actual namespace the SA lives in