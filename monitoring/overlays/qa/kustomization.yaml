apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring-qa          # ← overrides ALL resource namespaces

namePrefix: qa-                   # optional: prefixes resource names

resources:
  - ../../base
  - namespace.yaml                 # env-specific namespace
  - prometheus-rbac-patch.yaml     # permissions for pod discovery in dwp-qa

patchesStrategicMerge:
  - patch-prometheus-config.yaml   # env-specific scrape targets
  - patch-resources.yaml           # lower limits for qa

labels:
  - pairs:
      environment: qa