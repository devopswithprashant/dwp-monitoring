# overlays/dev/prometheus-rbac-patch.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dev-prometheus          # must match: base name "prometheus" + namePrefix "dev-"
subjects:
  - kind: ServiceAccount
    name: dev-prometheus        # same — namePrefix applies to SA too
    namespace: monitoring-dev   # ← the actual namespace the SA lives in