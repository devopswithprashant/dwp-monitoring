# overlays/dev/prometheus-rbac-patch.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus          # ← base name (before namePrefix is applied)
subjects:
  - kind: ServiceAccount
    name: dev-prometheus    # ← explicitly set the prefixed SA name (namePrefix won't do this for you)
    namespace: monitoring-dev