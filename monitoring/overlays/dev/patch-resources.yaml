# Dev: slim resources
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring-dev
spec:
  template:
    spec:
      containers:
        - name: prometheus
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring-dev
spec:
  template:
    spec:
      containers:
        - name: grafana
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi