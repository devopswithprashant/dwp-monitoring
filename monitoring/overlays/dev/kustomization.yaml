apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring-dev          # ← overrides ALL resource namespaces

namePrefix: dev-                   # optional: prefixes resource names

resources:
  - ../../base
  - namespace.yaml                 # env-specific namespace

patches:
  - path: patch-resources.yaml    # lower limits for dev
  - path: patch-prometheus-config.yaml  # env-specific scrape targets

labels:
  - pairs:
      environment: dev