apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring-dev          # ← overrides ALL resource namespaces

namePrefix: dev-                   # optional: prefixes resource names

resources:
  - ../../base
  - namespace.yaml                 # env-specific namespace
  

patchesStrategicMerge:
  - patch-prometheus-config.yaml   # env-specific scrape targets
  - patch-resources.yaml           # lower limits for dev
  - prometheus-rbac-patch.yaml     # permissions for pod discovery in dwp-dev

labels:
  - pairs:
      environment: dev