apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring-dev          # ← overrides ALL resource namespaces

namePrefix: dev-                   # optional: prefixes resource names

resources:
  - ../../base
  - namespace.yaml                 # env-specific namespace
  

patches:
  - path: patch-prometheus-config.yaml   # ← must be an object with "path:" key
  - path: patch-resources.yaml
  - path: prometheus-rbac-patch.yaml
  - path: patch-grafana-datasource.yaml

labels:
  - pairs:
      environment: dev